map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream collab_api {
  server server:4000;
}

upstream collab_ws {
  server server:1234;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;

  # Matches COLLAB_MAX_MESSAGE_BYTES so oversized requests are rejected at the edge too.
  client_max_body_size 1m;

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  # GraphQL over HTTP and graphql-ws subscriptions.
  location /graphql {
    proxy_pass http://collab_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 1h;
  }

  # Yjs collaboration WebSocket (Hocuspocus).
  location /collab {
    proxy_pass http://collab_ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Client-side routes fall back to the SPA entry point.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
