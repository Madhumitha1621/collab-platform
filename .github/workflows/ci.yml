name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, unit/integration and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: collab
          POSTGRES_PASSWORD: collab
          POSTGRES_DB: collab_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U collab" --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://collab:collab@localhost:5433/collab_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: |
          npx tsc -p apps/server/tsconfig.build.json --noEmit
          npx tsc -p apps/web/tsconfig.json --noEmit
      - name: Build
        run: npm run build
      - name: Server tests (GraphQL, collaboration, persistence, features, multi-instance)
        run: npm test
      - name: Browser end-to-end tests (Chrome)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build server image
        run: docker build -f apps/server/Dockerfile -t collab-server .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t collab-web .
